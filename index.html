<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3157d5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Control de Flauta</title>
<link rel="manifest" href="manifest.json">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
*{box-sizing:border-box} body{margin:0}
header{background:#3157d5;color:white;padding:18px 18px 16px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 12px}.sub{opacity:.9;font-size:13px}
main{max-width:900px;margin:auto;padding:16px}
.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000b}
label{font-weight:600;font-size:14px;display:block;margin-bottom:7px}
select,input,button{font:inherit} select,input{width:100%;padding:12px;border:1px solid #d8deeb;border-radius:12px;background:white}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
button{border:0;border-radius:12px;padding:11px 13px;font-weight:700;cursor:pointer}
.tab{background:#e8ecf7;color:#33405a}.tab.active{background:#3157d5;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#e9edf6}.primary{background:#3157d5;color:white}
.date-row{display:flex;gap:10px;align-items:end}.date-row>div{flex:1}
.student{display:grid;grid-template-columns:1fr auto auto auto;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f5}
.student:last-child{border-bottom:0}.name{font-weight:600}
.mark{min-width:46px;padding:9px 7px;background:#eef1f7;color:#34405a}.mark.on-yes{background:#d9f4e3;color:#13713b}.mark.on-no{background:#fde0e0;color:#a51e1e}.mark.on-abs{background:#e6e8ed;color:#555}
.empty{text-align:center;color:#697386;padding:28px 10px}
.hidden{display:none!important}.pill{font-size:12px;background:#eef1f7;padding:5px 8px;border-radius:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f4f6fa;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}
@media(max-width:600px){.student{grid-template-columns:1fr auto auto auto}.student .name{font-size:14px}.mark{min-width:40px;font-size:12px;padding:9px 5px}}
</style>
</head>
<body>
<header><h1>🎵 Control de Flauta</h1><div class="sub">Registro diario de tus alumnos</div></header>
<main>
<div class="tabs">
<button class="tab active" data-tab="registro">Registro</button>
<button class="tab" data-tab="alumnos">Alumnos</button>
<button class="tab" data-tab="resumen">Resumen</button>
</div>

<section id="registro">
<div class="card">
<label>Clase</label><select id="classSelect"></select>
<div class="date-row" style="margin-top:12px"><div><label>Fecha</label><input type="date" id="date"></div></div>
</div>
<div class="card">
<div id="studentList"></div>
</div>
</section>

<section id="alumnos" class="hidden">
<div class="card">
<h2 style="margin-top:0">Gestionar alumnos</h2>
<p style="color:#697386">Puedes importar un CSV con las columnas <b>Clase, Alumno</b> o añadir alumnos manualmente.</p>
<div class="actions">
<button class="primary" id="importBtn">📥 Importar CSV</button>
<button class="secondary" id="downloadTemplate">📄 Plantilla CSV</button>
<input type="file" id="fileInput" accept=".csv,text/csv" class="hidden">
</div>
</div>
<div class="card">
<label>Clase</label><select id="manageClass"></select>
<div class="actions" style="margin-top:10px"><input id="newStudent" placeholder="Nombre del alumno"><button class="primary" id="addStudent">Añadir</button></div>
<div id="manageList" style="margin-top:12px"></div>
</div>
</section>

<section id="resumen" class="hidden">
<div class="card"><label>Clase</label><select id="summaryClass"></select></div>
<div class="card"><div class="stats"><div class="stat"><b id="daysCount">0</b>Días registrados</div><div class="stat"><b id="studentsCount">0</b>Alumnos</div><div class="stat"><b id="missingCount">0</b>Sin flauta</div></div></div>
<div class="card"><div id="summaryList"></div></div>
<div class="card"><button class="primary" id="exportBtn">📤 Exportar registros a CSV</button></div>
</section>
</main>
<script>
const KEY="flauta-v1";
const defaultData={classes:["1º ESO A","1º ESO B","1º ESO C","1º ESO D","2º ESO A","2º ESO B","2º ESO C","2º ESO D","4º ESO D"].map(name=>({name,students:[]})),records:{}};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||defaultData;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const today=()=>new Date().toISOString().slice(0,10);
document.getElementById("date").value=today();

function populate(){
  ["classSelect","manageClass","summaryClass"].forEach(id=>{
    const s=document.getElementById(id), old=s.value;
    s.innerHTML=data.classes.map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join("");
    if(old!=="" && data.classes[old]) s.value=old;
  });
  renderStudents(); renderManage(); renderSummary();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function key(){return `${document.getElementById("date").value}|${document.getElementById("classSelect").value}`}
function renderStudents(){
 const ci=+document.getElementById("classSelect").value,c=data.classes[ci], r=data.records[key()]||{};
 const el=document.getElementById("studentList");
 if(!c.students.length){el.innerHTML='<div class="empty">Aún no hay alumnos en esta clase.<br>Ve a <b>Alumnos</b> para importarlos.</div>';return}
 el.innerHTML=c.students.map((n,i)=>{
   const v=r[n]||"";
   return `<div class="student"><div class="name">${esc(n)}</div>
   <button class="mark ${v==="yes"?"on-yes":""}" onclick="mark(${i},'yes')">🎵 Sí</button>
   <button class="mark ${v==="no"?"on-no":""}" onclick="mark(${i},'no')">❌ No</button>
   <button class="mark ${v==="abs"?"on-abs":""}" onclick="mark(${i},'abs')">—</button></div>`
 }).join("");
}
function mark(i,v){
 const ci=+document.getElementById("classSelect").value,k=key();
 data.records[k] ||= {}; const n=data.classes[ci].students[i];
 data.records[k][n]=data.records[k][n]===v?"":v; save(); renderStudents(); renderSummary();
}
function renderManage(){
 const ci=+document.getElementById("manageClass").value,c=data.classes[ci];
 document.getElementById("manageList").innerHTML=c.students.length
 ? c.students.map((n,i)=>`<div class="student"><div class="name">${esc(n)}</div><span class="pill">${i+1}</span><button class="secondary" onclick="removeStudent(${i})">Eliminar</button></div>`).join("")
 : '<div class="empty">No hay alumnos.</div>';
}
function removeStudent(i){const ci=+document.getElementById("manageClass").value; if(confirm("¿Eliminar este alumno?")){data.classes[ci].students.splice(i,1);save();populate()}}
function addStudent(){
 const ci=+document.getElementById("manageClass").value,n=document.getElementById("newStudent").value.trim();
 if(!n)return; if(!data.classes[ci].students.includes(n)) data.classes[ci].students.push(n);
 document.getElementById("newStudent").value="";save();populate();
}
function renderSummary(){
 const ci=+document.getElementById("summaryClass").value,c=data.classes[ci];
 const entries=Object.entries(data.records).filter(([k])=>k.endsWith("|"+ci));
 document.getElementById("daysCount").textContent=new Set(entries.map(([k])=>k.split("|")[0])).size;
 document.getElementById("studentsCount").textContent=c.students.length;
 let missing=0; const rows=c.students.map(n=>{
   let yes=0,no=0,abs=0; entries.forEach(([,r])=>{if(r[n]==="yes")yes++;if(r[n]==="no"){no++;missing++}if(r[n]==="abs")abs++});
   const total=yes+no; const pct=total?Math.round(yes/total*100):0;
   return `<div class="student"><div><div class="name">${esc(n)}</div><small>${yes} con flauta · ${no} sin · ${abs} ausencias</small></div><span class="pill">${pct}%</span></div>`
 });
 document.getElementById("missingCount").textContent=missing;
 document.getElementById("summaryList").innerHTML=rows.join("")||'<div class="empty">No hay alumnos.</div>';
}
document.getElementById("classSelect").onchange=renderStudents;
document.getElementById("date").onchange=renderStudents;
document.getElementById("manageClass").onchange=renderManage;
document.getElementById("summaryClass").onchange=renderSummary;
document.getElementById("addStudent").onclick=addStudent;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");["registro","alumnos","resumen"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==b.dataset.tab)); if(b.dataset.tab==="resumen")renderSummary()});

document.getElementById("importBtn").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=async e=>{
 const f=e.target.files[0]; if(!f)return; const txt=await f.text();
 const lines=txt.replace(/^\uFEFF/,"").split(/\r?\n/).filter(Boolean);
 const sep=lines[0].includes(";")?";":",";
 const start=/clase/i.test(lines[0])&&/alumno|nombre/i.test(lines[0])?1:0;
 for(let j=start;j<lines.length;j++){
   const parts=lines[j].split(sep).map(x=>x.trim().replace(/^"|"$/g,""));
   if(parts.length<2)continue;
   const cls=parts[0],name=parts[1]; let ci=data.classes.findIndex(c=>c.name.toLowerCase()===cls.toLowerCase());
   if(ci<0 && /^clase\s*[1-9]$/i.test(cls)) ci=parseInt(cls.match(/\d+/)[0],10)-1;
   if(ci>=0&&ci<9&&name&&!data.classes[ci].students.includes(name))data.classes[ci].students.push(name);
 }
 save();populate();e.target.value="";alert("Alumnos importados.");
};
document.getElementById("downloadTemplate").onclick=()=>{
 const csv="Clase,Alumno\nClase 1,Ana García\nClase 1,Pablo López\nClase 2,Lucía Martín\n";
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="plantilla_alumnos.csv";a.click();
};
document.getElementById("exportBtn").onclick=()=>{
 let out="Fecha,Clase,Alumno,Estado\n";
 Object.entries(data.records).forEach(([k,r])=>{const [date,ci]=k.split("|");Object.entries(r).forEach(([n,v])=>{if(v)out+=`${date},"${data.classes[ci].name.replace(/"/g,'""')}","${n.replace(/"/g,'""')}",${v}\n`})});
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/csv;charset=utf-8"}));a.download="registro_flauta.csv";a.click();
};
populate();
</script>
</body></html>
